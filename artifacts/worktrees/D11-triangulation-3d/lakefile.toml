# Worktree-root Lake environment for the compile gate.
#
# The harness compile gate walks every `.lean` file in the worktree and runs
# `lake env lean <file>` with the *worktree root* as the working directory.
# This root package pins the same toolchain and mathlib and points its package
# directory and build library at the release package's artifacts via the
# symlinks `.lake/packages` and `.lake/build/lib/lean`.  No Lean sources,
# no mathematical content.
name = "PoincareRelease"
version = "0.1.0"
description = "D11 worktree root workspace: exposes the release/ package's build artifacts so that `lake env lean <file>` works from the worktree root."
defaultTargets = []

# Toolchain is pinned by ./lean-toolchain; the mathlib revision by ./lake-manifest.json.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"
