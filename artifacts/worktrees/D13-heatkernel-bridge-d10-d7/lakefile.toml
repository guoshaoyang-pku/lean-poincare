name = "PoincareRelease"
version = "0.1.0"
description = "D11-heat-kernel-manifold-bridge worktree-root workspace: exposes the release/ package build artifacts so that `lake env lean <file>` works from the worktree root (the compile gate runs there)."

# Toolchain is pinned by ./lean-toolchain; the mathlib revision by ./lake-manifest.json.
# The local build artifacts are shared with release/ via the `.lake -> release/.lake` symlink.
# This file contains no Lean sources and no mathematical content.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"
