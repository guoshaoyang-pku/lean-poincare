name = "D13Probes"
version = "0.1.0"
description = "D13 adapter probes: consume selected frenzymath upstream APIs under the upstream pin (Lean v4.32.1, mathlib 520045ab) without modifying or flattening the upstream packages"
keywords = ["math", "probe"]
defaultTargets = ["D13Probes"]

# Upstream packages are required BY PATH and keep their own pinned
# lean-toolchain / lake-manifest.json.  Nothing here rewrites an upstream pin.

[[require]]
name = "Shared"
path = "../third_party/frenzymath/Poincare-Conjecture/shared"

[[require]]
name = "DoCarmoLib"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/DoCarmo"

[[require]]
name = "EvansLib"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/Evans"

[[require]]
name = "HatcherLib"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/Hatcher"

[[require]]
name = "MorganTianLib"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/MorganTian"

[[require]]
name = "PetersenLib"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/Petersen"

[[require]]
name = "Topping"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/Topping"

[[require]]
name = "KleinerLott"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/KleinerLott"

[[require]]
name = "LeeLib"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/LeeRiemannian"

[[require]]
name = "GilbargTrudinger"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/GilbargTrudinger"

[[require]]
name = "HanLinLectureNotes"
path = "../third_party/frenzymath/Poincare-Conjecture/formalized-sources/HanLinLectureNotes"

[[lean_lib]]
name = "D13Probes"
globs = ["D13Probes.+"]
