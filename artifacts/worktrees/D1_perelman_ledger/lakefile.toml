name = "PerelmanLedger"
version = "0.1.0"
description = "D1 Perelman theorem-ledger interfaces (isolated worktree package)"
keywords = ["math", "ricci-flow", "perelman"]

defaultTargets = ["Ledger"]

# Pinned to the same mathlib revision as the shared `poincare-lab` package so that the
# prebuilt olean cache can be reused without any rebuild.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "7974e751bece493b6ff508039423ca9fa2452fa8"

[[lean_lib]]
name = "Ledger"
globs = ["Ledger.+"]
