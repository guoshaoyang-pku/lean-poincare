name = "Poincare"
version = "0.1.0"
description = "Formalization skeleton for the Poincare conjecture via the Ricci flow programme (Hamilton-Perelman)"
keywords = ["math"]
defaultTargets = ["Poincare"]

# Lean toolchain is pinned in ./lean-toolchain and must match mathlib's current requirement.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

# The package's own library: `Poincare.+` globs all modules under the
# Poincare/ directory tree (e.g. Poincare.Basic, Poincare.Stage3.X, ...).
[[lean_lib]]
name = "Poincare"
globs = ["Poincare.+"]
