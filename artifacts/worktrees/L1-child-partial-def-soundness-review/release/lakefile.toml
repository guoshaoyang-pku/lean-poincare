name = "PoincareRelease"
version = "0.1.0"
description = "D6 weekly release package: accepted D5 clean-room package (D1-D4 clusters) plus the D6 per-declaration axiom report"
keywords = ["math"]
defaultTargets = ["Poincare", "Probe", "Ledger", "Audit", "ReleaseCheck", "ReleaseAudit", "D6AuditReport"]

# Toolchain is pinned by ./lean-toolchain; the exact mathlib revision is pinned by
# ./lake-manifest.json (rev recorded in manifest/build-manifest.json).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "master"

[[lean_lib]]
name = "Poincare"
globs = ["Poincare.+"]

[[lean_lib]]
name = "Probe"
globs = ["Probe.+"]

[[lean_lib]]
name = "Ledger"
globs = ["Ledger.+"]

[[lean_lib]]
name = "Audit"
globs = ["Audit.+"]

[[lean_lib]]
name = "ReleaseCheck"

[[lean_lib]]
name = "ReleaseAudit"

[[lean_lib]]
name = "D6AuditReport"
